name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Release notes come from CHANGELOG.md, not from the commit log, so the release page,
      # the changelog file and npm all carry the same reviewed text. A tag without a matching
      # section fails here instead of publishing an empty release.
      - run: node scripts/release.mjs section --version="${GITHUB_REF_NAME#v}" > release-notes.md

      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
