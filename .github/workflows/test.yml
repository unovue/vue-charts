name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter vccs build

      - run: pnpm typecheck

      - run: pnpm --filter vccs exec vitest run --maxWorkers=2

      - name: Check tooling regressions and motion tokens
        run: |
          node --test scripts/check-verdicts.test.mjs scripts/check-process.test.mjs scripts/benchmark-verdict.test.mjs scripts/benchmark-motion.test.mjs packages/vue/test/lab/report-metrics.test.mjs
          node scripts/update-motion-docs.mjs --check
          node packages/vue/test/lab/cli.mjs help

      - run: pnpm lint

      - run: pnpm check:code

      - run: pnpm check:bundle --assert-standalone

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: code-and-bundle-failure
          include-hidden-files: true
          path: |
            .evidence/code/
            .evidence/bundle/**/results.json
          if-no-files-found: warn

      - run: pnpm --filter vccs size

      # This SSR fixture uses browser: false; no Playwright browser is needed.
      - run: pnpm --filter vccs test:nuxt

  consumers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install locked Playwright Chromium headless shell
        run: node scripts/lib/browser.mjs --install-browser --with-deps chromium-headless-shell

      - run: node scripts/check-consumers.mjs

  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install locked Playwright Chromium headless shell
        run: node scripts/lib/browser.mjs --install-browser --with-deps chromium-headless-shell

      - run: pnpm check:motion

      - run: node --test scripts/check-motion-report.test.mjs

      - run: pnpm check:a11y

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-results
          include-hidden-files: true
          path: |
            .evidence/motion/
            .evidence/a11y/
          if-no-files-found: warn

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:package

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-docs-coverage.mjs
      - run: pnpm --filter vccs build
      - run: pnpm --filter docs build
