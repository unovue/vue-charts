name: Test

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter vccs build

      - run: pnpm --filter vccs typecheck

      - run: pnpm test

  consumers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/check-consumers.mjs

  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Ignore local motion evidence
        run: echo '.evidence/' >> .git/info/exclude

      - name: Install locked Playwright Chromium headless shell
        run: node scripts/check-motion.mjs --install-browser

      - name: Check fixture and runner lint
        run: pnpm exec eslint scripts/check-motion.mjs packages/vue/test/fixtures/motion --max-warnings 0

      - run: pnpm check:motion

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-results
          include-hidden-files: true
          path: .evidence/s21/
          if-no-files-found: warn
